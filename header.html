<style>
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    width: 100%;
    min-height: 76px;
    background: rgba(11, 16, 32, 0.58);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
  }

  .topbar-inner {
    display: flex;
    width: min(1060px, calc(100% - 40px));
    min-height: inherit;
    align-items: center;
    justify-content: space-between;
    margin-inline: auto;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
    font-weight: 750;
    letter-spacing: 0.02em;
    text-decoration: none;
    white-space: nowrap;
  }

  .brand-logo {
    display: block;
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    overflow: visible;
  }

  .brand-logo-data {
    stroke-dasharray: 2 3;
    animation: brand-logo-data-flow 1.6s linear infinite;
  }

  .brand-logo-status {
    animation: brand-logo-status-pulse 1.8s ease-in-out infinite;
  }

  @keyframes brand-logo-data-flow {
    to {
      stroke-dashoffset: -10;
    }
  }

  @keyframes brand-logo-status-pulse {
    50% {
      opacity: 0.35;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand-logo-data,
    .brand-logo-status {
      animation: none;
    }
  }

  .brand-name {
    color: #e7eaf3;
  }

  .brand-name span {
    color: var(--cyan);
  }

  .topbar nav {
    display: flex;
    gap: 26px;
  }

  .topbar[data-page="portfolio"] nav {
    flex-wrap: wrap;
    gap: 22px;
  }

  .topbar nav a {
    color: var(--muted);
    font-size: 0.88rem;
    text-decoration: none;
    transition: color 160ms ease;
  }

  .topbar nav a:hover,
  .topbar nav a:focus-visible,
  .topbar nav a[aria-current="page"] {
    color: var(--cyan);
  }

  @media (max-width: 680px) {
    .topbar {
      min-height: 66px;
    }

    .topbar-inner {
      width: min(100% - 32px, 520px);
      align-items: flex-start;
      flex-direction: column;
      gap: 12px;
      padding-block: 14px;
    }

    .topbar nav {
      flex-wrap: wrap;
      gap: 14px;
    }

    .topbar[data-page="portfolio"] nav {
      gap: 12px;
    }

    .topbar nav a {
      font-size: 0.78rem;
    }
  }

  @media (max-width: 390px) {
    .topbar nav {
      gap: 9px;
    }

    .topbar nav a {
      font-size: 0.72rem;
    }
  }
</style>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" data-header-home href="#" aria-label="Eko Setiawan, beranda">
      <svg class="brand-logo" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="brand-logo-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#66e3ee" />
            <stop offset="1" stop-color="#9c8cff" />
          </linearGradient>
        </defs>
        <circle cx="20" cy="20" r="19" fill="#121a31" stroke="url(#brand-logo-gradient)" stroke-width="2" />
        <g transform="translate(3.6 3.6) scale(0.82)">
          <rect x="4.5" y="7" width="23" height="26" rx="3" fill="#17213a" stroke="#e7eaf3" stroke-width="1.5" />
          <path d="M5 13h22" stroke="#e7eaf3" stroke-width="1.5" />
          <circle cx="8" cy="10" r="0.8" fill="#66e3ee" />
          <path d="m12 18-3 3 3 3m5-6 3 3-3 3" fill="none" stroke="#66e3ee" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" />
          <rect x="25" y="12" width="10.5" height="21" rx="2" fill="#121a31" stroke="#9c8cff" stroke-width="1.5" />
          <path d="M27.5 17h5.5m-5.5 5h5.5m-5.5 5h5.5" stroke="#a7b0c5" stroke-linecap="round" stroke-width="1.2" />
          <circle class="brand-logo-status" cx="29" cy="17" r="0.9" fill="#66e3ee" />
          <circle class="brand-logo-status" cx="29" cy="22" r="0.9" fill="#66e3ee" />
          <circle class="brand-logo-status" cx="29" cy="27" r="0.9" fill="#66e3ee" />
          <path class="brand-logo-data" d="M20 30c2.5 0 2.5-5 5-5" fill="none" stroke="#66e3ee" stroke-linecap="round" stroke-width="1.5" />
        </g>
      </svg>
      <!-- <span class="brand-name">Eko <span>Setiawan</span></span> -->
    </a>
    <nav aria-label="Navigasi utama">
      <a data-header-section="about" href="#about">Tentang</a>
      <a data-header-section="projects" href="#projects">Completed Projects</a>
      <a data-header-portfolio href="portofolio.html">Portofolio</a>
      <a data-header-section="skills" href="#skills">Keahlian</a>
      <a data-header-section="activity" href="#activity">Github Streak</a>
      <a data-header-section="contact" href="#contact">Kontak Saya</a>
    </nav>
  </div>
</header>
