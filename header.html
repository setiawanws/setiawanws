<style>
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    width: 100%;
    min-height: 76px;
    background: rgba(11, 16, 32, 0.58);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
  }

  .topbar-inner {
    display: flex;
    width: min(1060px, calc(100% - 40px));
    min-height: inherit;
    align-items: center;
    justify-content: space-between;
    margin-inline: auto;
  }

  .brand {
    font-size: 0.95rem;
    font-weight: 750;
    letter-spacing: 0.02em;
    text-decoration: none;
  }

  .brand span {
    color: var(--cyan);
  }

  .topbar nav {
    display: flex;
    gap: 26px;
  }

  .topbar[data-page="portfolio"] nav {
    flex-wrap: wrap;
    gap: 22px;
  }

  .topbar nav a {
    color: var(--muted);
    font-size: 0.88rem;
    text-decoration: none;
    transition: color 160ms ease;
  }

  .topbar nav a:hover,
  .topbar nav a:focus-visible,
  .topbar nav a[aria-current="page"] {
    color: var(--cyan);
  }

  @media (max-width: 680px) {
    .topbar {
      min-height: 66px;
    }

    .topbar-inner {
      width: min(100% - 32px, 520px);
      align-items: flex-start;
      flex-direction: column;
      gap: 12px;
      padding-block: 14px;
    }

    .topbar nav {
      flex-wrap: wrap;
      gap: 14px;
    }

    .topbar[data-page="portfolio"] nav {
      gap: 12px;
    }

    .topbar nav a {
      font-size: 0.78rem;
